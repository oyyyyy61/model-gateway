# 示例文件，不要直接提交真实密钥。
# 创建真实 Secret：
#   kubectl -n model-gateway create secret generic model-gateway-secrets \
#     --from-literal=MGW_API_KEYS='<token>|<tenant>|<models>|<rpm>|<daily_tokens>|<name>' \
#     --from-literal=MGW_ADMIN_TOKEN='<admin-token>'
apiVersion: v1
kind: Secret
metadata:
  name: model-gateway-secrets
  namespace: model-gateway
  labels:
    app.kubernetes.io/name: model-gateway
type: Opaque
stringData:
  MGW_API_KEYS: "replace-me|tenant-a|qwen-72b|120|2000000|tenant-a"
  MGW_ADMIN_TOKEN: "replace-me"
