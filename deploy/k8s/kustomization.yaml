apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: model-gateway
resources:
  - namespace.yaml
  - configmap.yaml
  - deployment.yaml
  - service.yaml
  - hpa.yaml
  - podmonitor.yaml
  - prometheusrule.yaml
configMapGenerator:
  - name: model-gateway-dashboard
    files:
      - grafana-dashboard.json
    options:
      labels:
        grafana_dashboard: "1"
images:
  - name: ghcr.io/oyyyyy61/model-gateway
    newTag: 0.2.0
