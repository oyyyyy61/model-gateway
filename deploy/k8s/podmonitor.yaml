apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: model-gateway
  namespace: model-gateway
  labels:
    app.kubernetes.io/name: model-gateway
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: model-gateway
  podMetricsEndpoints:
    - port: http
      path: /metrics
      interval: 15s
      scrapeTimeout: 10s
